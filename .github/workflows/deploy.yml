name: Deploy to Oracle Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 163.176.126.198
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/projeto-forense || mkdir -p ~/projeto-forense && cd ~/projeto-forense
            git pull origin main || echo "No git repo initialized yet"
            sudo systemctl restart nginx
